<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Mua bán xe cũ</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f2f2f2;
      margin: 0;
      padding: 0;
    }
    header {
      background: #0d6efd;
      color: white;
      padding: 15px;
      text-align: center;
      font-size: 20px;
    }
    .container {
      padding: 15px;
    }
    .card {
      background: white;
      border-radius: 10px;
      padding: 15px;
      margin-bottom: 15px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    }
    .card img {
      width: 100%;
      border-radius: 8px;
    }
    .price {
      color: #e63946;
      font-weight: bold;
      margin-top: 5px;
    }
    button {
      width: 100%;
      padding: 12px;
      background: #198754;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      margin-top: 10px;
    }
  </style>
</head>
<body>

<header>🚗 Mua bán xe cũ</header>

<div class="container">

  <div class="card">
    <img src="https://via.placeholder.com/400x250?text=Toyota+Vios">
    <h3>Toyota Vios 2018</h3>
    <p class="price">420.000.000 VNĐ</p>
    <button>Liên hệ</button>
  </div>

  <div class="card">
    <img src="https://via.placeholder.com/400x250?text=Honda+AirBlade">
    <h3>Honda Air Blade 2020</h3>
    <p class="price">38.000.000 VNĐ</p>
    <a href="tel:0964398536" class="btn">Liên hệ</a>
  </div>

</div>

</body>
</html>
